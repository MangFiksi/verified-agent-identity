  name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Quick Install and Run
        run: |
          npm install ethers@5.7.2
          node -e "const crypto = require('crypto'); const id = crypto.randomBytes(32).toString('hex'); console.log('NEW_ID: ' + id); console.log('LINK: https://billions.network/bind?agent=MangFiksi&challenge=' + id)"
          
